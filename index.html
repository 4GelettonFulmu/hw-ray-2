<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Game - Choose Your Shoes!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            background: #87CEEB;
            cursor: grab;
        }

        #gameCanvas:active {
            cursor: grabbing;
        }

        #shoeSelection {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 10;
        }

        #shoeSelection.hidden {
            display: none;
        }

        #shoeSelection h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 28px;
        }

        #shoeSelection p {
            margin-bottom: 30px;
            color: #666;
            font-size: 16px;
        }

        .shoeButtons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .shoeBtn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .shoeBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .shoeBtn:active {
            transform: translateY(0);
        }

        #sneakersBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #heelsBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 5;
        }

        #instructions.hidden {
            display: none;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 10;
        }

        #gameOver.hidden {
            display: none;
        }

        #gameOver h2 {
            margin-bottom: 20px;
            color: #f5576c;
            font-size: 32px;
        }

        #restartBtn {
            padding: 15px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        #restartBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        #victory {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 10;
        }

        #victory.hidden {
            display: none;
        }

        #victory h2 {
            margin-bottom: 20px;
            color: #4CAF50;
            font-size: 32px;
        }

        #playAgainBtn {
            padding: 15px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        #playAgainBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>

        <div id="shoeSelection">
            <h2>Choose Your Shoes!</h2>
            <p>Start your journey barefoot, but first pick your shoes wisely...</p>
            <div class="shoeButtons">
                <button id="sneakersBtn" class="shoeBtn">👟 Sneakers<br><small>(Easy Mode)</small></button>
                <button id="heelsBtn" class="shoeBtn">👠 High Heels<br><small>(Hard Mode)</small></button>
            </div>
        </div>

        <div id="instructions" class="hidden">
            Drag the feet to walk! Keep your balance and reach the right side of the screen!
        </div>

        <div id="gameOver" class="hidden">
            <h2>You Fell! 💫</h2>
            <p>Better luck next time!</p>
            <button id="restartBtn">Try Again</button>
        </div>

        <div id="victory" class="hidden">
            <h2>You Made It! 🎉</h2>
            <p>Congratulations on reaching the end!</p>
            <button id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game states
        const STATES = {
            SHOE_SELECTION: 'shoeSelection',
            PLAYING: 'playing',
            FALLEN: 'fallen',
            VICTORY: 'victory'
        };

        // Game state
        let gameState = STATES.SHOE_SELECTION;
        let selectedShoe = null;

        // Person object
        const person = {
            x: 150,
            y: 350,
            width: 40,
            height: 100,
            angle: 0,
            targetAngle: 0,
            leftFootX: 140,
            leftFootY: 450,
            rightFootX: 160,
            rightFootY: 450,
            balance: 0,
            maxBalance: 100
        };

        // Drag state
        let draggedFoot = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // Shoe difficulty settings (50% easier)
        const shoeSettings = {
            sneakers: {
                balanceDecay: 0.15,
                balanceThreshold: 80,
                stepSize: 15
            },
            heels: {
                balanceDecay: 0.4,
                balanceThreshold: 50,
                stepSize: 8
            }
        };

        let currentSettings = null;

        // UI Elements
        const shoeSelectionEl = document.getElementById('shoeSelection');
        const instructionsEl = document.getElementById('instructions');
        const gameOverEl = document.getElementById('gameOver');
        const victoryEl = document.getElementById('victory');
        const sneakersBtn = document.getElementById('sneakersBtn');
        const heelsBtn = document.getElementById('heelsBtn');
        const restartBtn = document.getElementById('restartBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // Event listeners for shoe selection
        sneakersBtn.addEventListener('click', () => selectShoe('sneakers'));
        heelsBtn.addEventListener('click', () => selectShoe('heels'));
        restartBtn.addEventListener('click', restart);
        playAgainBtn.addEventListener('click', restart);

        function selectShoe(shoe) {
            selectedShoe = shoe;
            currentSettings = shoeSettings[shoe];
            shoeSelectionEl.classList.add('hidden');
            instructionsEl.classList.remove('hidden');
            gameState = STATES.PLAYING;
            requestAnimationFrame(gameLoop);
        }

        function restart() {
            // Reset person position
            person.x = 150;
            person.y = 350;
            person.angle = 0;
            person.targetAngle = 0;
            person.leftFootX = 140;
            person.leftFootY = 450;
            person.rightFootX = 160;
            person.rightFootY = 450;
            person.balance = 0;

            // Reset game state
            selectedShoe = null;
            currentSettings = null;
            draggedFoot = null;

            // Reset UI
            gameOverEl.classList.add('hidden');
            victoryEl.classList.add('hidden');
            instructionsEl.classList.add('hidden');
            shoeSelectionEl.classList.remove('hidden');
            gameState = STATES.SHOE_SELECTION;
        }

        // Mouse events for dragging feet
        canvas.addEventListener('mousedown', handleMouseDown);
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseup', handleMouseUp);
        canvas.addEventListener('mouseleave', handleMouseUp);

        // Touch events for mobile
        canvas.addEventListener('touchstart', handleTouchStart);
        canvas.addEventListener('touchmove', handleTouchMove);
        canvas.addEventListener('touchend', handleTouchEnd);

        function handleMouseDown(e) {
            if (gameState !== STATES.PLAYING) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            checkFootGrab(mouseX, mouseY);
        }

        function handleMouseMove(e) {
            if (gameState !== STATES.PLAYING || !draggedFoot) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            moveFoot(mouseX, mouseY);
        }

        function handleMouseUp() {
            draggedFoot = null;
        }

        function handleTouchStart(e) {
            e.preventDefault();
            if (gameState !== STATES.PLAYING) return;

            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const touchX = touch.clientX - rect.left;
            const touchY = touch.clientY - rect.top;

            checkFootGrab(touchX, touchY);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (gameState !== STATES.PLAYING || !draggedFoot) return;

            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const touchX = touch.clientX - rect.left;
            const touchY = touch.clientY - rect.top;

            moveFoot(touchX, touchY);
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            draggedFoot = null;
        }

        function checkFootGrab(x, y) {
            const footRadius = 20;

            // Check left foot
            const distLeft = Math.sqrt(Math.pow(x - person.leftFootX, 2) + Math.pow(y - person.leftFootY, 2));
            if (distLeft < footRadius) {
                draggedFoot = 'left';
                dragOffsetX = x - person.leftFootX;
                dragOffsetY = y - person.leftFootY;
                return;
            }

            // Check right foot
            const distRight = Math.sqrt(Math.pow(x - person.rightFootX, 2) + Math.pow(y - person.rightFootY, 2));
            if (distRight < footRadius) {
                draggedFoot = 'right';
                dragOffsetX = x - person.rightFootX;
                dragOffsetY = y - person.rightFootY;
                return;
            }
        }

        function moveFoot(x, y) {
            const newX = x - dragOffsetX;
            const newY = Math.max(400, Math.min(470, y - dragOffsetY));

            if (draggedFoot === 'left') {
                const maxDist = 80;
                const dist = Math.abs(newX - person.leftFootX);

                if (dist <= maxDist) {
                    person.leftFootX = newX;
                    person.leftFootY = newY;
                    updatePersonPosition();
                }
            } else if (draggedFoot === 'right') {
                const maxDist = 80;
                const dist = Math.abs(newX - person.rightFootX);

                if (dist <= maxDist) {
                    person.rightFootX = newX;
                    person.rightFootY = newY;
                    updatePersonPosition();
                }
            }
        }

        function updatePersonPosition() {
            // Update person's x position based on feet
            person.x = (person.leftFootX + person.rightFootX) / 2;

            // Calculate balance based on foot positions (more forgiving thresholds)
            const footDistance = Math.abs(person.leftFootX - person.rightFootX);
            const footHeightDiff = Math.abs(person.leftFootY - person.rightFootY);

            // Feet too far apart or at different heights causes imbalance (increased from 100 to 150)
            if (footDistance > 150 || footHeightDiff > 30) {
                person.balance += currentSettings.balanceDecay * 1.5;
            } else if (footDistance < 10) {
                // Feet too close together also causes imbalance (reduced from 20 to 10)
                person.balance += currentSettings.balanceDecay;
            } else {
                // Good stance, reduce balance faster
                person.balance = Math.max(0, person.balance - 1.0);
            }

            // Calculate tilt angle based on foot positions (less sensitive)
            person.targetAngle = (person.leftFootX - person.rightFootX) * 0.015;

            // Check if fallen (increased tolerance from 0.5 to 1.0)
            if (Math.abs(person.targetAngle) > 1.0 || person.balance > currentSettings.balanceThreshold) {
                fall();
            }

            // Check for victory
            if (person.x > canvas.width - 100) {
                victory();
            }
        }

        function fall() {
            gameState = STATES.FALLEN;
            instructionsEl.classList.add('hidden');
            gameOverEl.classList.remove('hidden');
        }

        function victory() {
            gameState = STATES.VICTORY;
            instructionsEl.classList.add('hidden');
            victoryEl.classList.remove('hidden');
        }

        // Drawing functions
        function drawStreet() {
            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, 200);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(1, '#B0E2FF');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, 200);

            // Sun
            ctx.fillStyle = '#FFD700';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#FFD700';
            ctx.beginPath();
            ctx.arc(850, 60, 35, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Sun rays
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 / 8) * i;
                ctx.beginPath();
                ctx.moveTo(850 + Math.cos(angle) * 40, 60 + Math.sin(angle) * 40);
                ctx.lineTo(850 + Math.cos(angle) * 60, 60 + Math.sin(angle) * 60);
                ctx.stroke();
            }

            // Clouds
            drawCloud(150, 40, 1);
            drawCloud(400, 70, 0.8);
            drawCloud(700, 50, 1.2);

            // Birds
            drawBird(250, 90);
            drawBird(320, 110);
            drawBird(600, 85);

            // Buildings in background with more details
            const buildingColors = ['#7A7A7A', '#8B8B8B', '#696969', '#808080', '#6B6B6B'];
            const buildingHeights = [180, 220, 160, 200, 170];

            for (let i = 0; i < 5; i++) {
                const buildingX = i * 220 + 50;
                const buildingHeight = buildingHeights[i];

                // Building shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(buildingX + 5, 200 - buildingHeight + 5, 180, buildingHeight);

                // Main building
                ctx.fillStyle = buildingColors[i];
                ctx.fillRect(buildingX, 200 - buildingHeight, 180, buildingHeight);

                // Building roof
                ctx.fillStyle = '#5A5A5A';
                ctx.fillRect(buildingX - 5, 200 - buildingHeight - 10, 190, 10);

                // Roof details
                ctx.fillStyle = '#4A4A4A';
                ctx.fillRect(buildingX + 70, 200 - buildingHeight - 20, 40, 10);

                // Windows with reflections
                for (let row = 0; row < buildingHeight / 30; row++) {
                    for (let col = 0; col < 4; col++) {
                        const windowX = buildingX + col * 40 + 20;
                        const windowY = 200 - buildingHeight + row * 30 + 10;

                        // Window background
                        ctx.fillStyle = Math.random() > 0.4 ? '#FFE66D' : '#4A6FA5';
                        ctx.fillRect(windowX, windowY, 20, 20);

                        // Window frame
                        ctx.strokeStyle = '#333333';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(windowX, windowY, 20, 20);

                        // Window panes
                        ctx.beginPath();
                        ctx.moveTo(windowX + 10, windowY);
                        ctx.lineTo(windowX + 10, windowY + 20);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(windowX, windowY + 10);
                        ctx.lineTo(windowX + 20, windowY + 10);
                        ctx.stroke();

                        // Window reflection
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                        ctx.fillRect(windowX, windowY, 8, 8);
                    }
                }

                // Building entrance (on first floor)
                if (i % 2 === 0) {
                    ctx.fillStyle = '#3A3A3A';
                    ctx.fillRect(buildingX + 75, 200 - 30, 30, 30);
                    ctx.strokeStyle = '#2A2A2A';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(buildingX + 75, 200 - 30, 30, 30);
                }
            }

            // Grass with texture
            const grassGradient = ctx.createLinearGradient(0, 200, 0, 470);
            grassGradient.addColorStop(0, '#7CCD7C');
            grassGradient.addColorStop(1, '#90EE90');
            ctx.fillStyle = grassGradient;
            ctx.fillRect(0, 200, canvas.width, 270);

            // Grass blades detail
            ctx.strokeStyle = 'rgba(60, 179, 113, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 10) {
                for (let j = 200; j < 470; j += 15) {
                    ctx.beginPath();
                    ctx.moveTo(i, j);
                    ctx.lineTo(i + Math.random() * 4 - 2, j - 5);
                    ctx.stroke();
                }
            }

            // Enhanced trees with more detail
            for (let i = 100; i < canvas.width; i += 200) {
                drawDetailedTree(i, 350);
            }

            // Flowers and bushes
            drawFlowers(300, 440);
            drawFlowers(650, 435);
            drawBush(180, 430);
            drawBush(820, 425);

            // Sidewalk with texture
            ctx.fillStyle = '#A9A9A9';
            ctx.fillRect(0, 470, canvas.width, 10);

            // Sidewalk edge detail
            ctx.strokeStyle = '#8B8B8B';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 470);
            ctx.lineTo(canvas.width, 470);
            ctx.stroke();

            // Sidewalk tiles
            ctx.strokeStyle = 'rgba(139, 139, 139, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 470);
                ctx.lineTo(i, 480);
                ctx.stroke();
            }

            // Street lamps
            drawStreetLamp(250, 470);
            drawStreetLamp(750, 470);

            // Road with gradient
            const roadGradient = ctx.createLinearGradient(0, 480, 0, 600);
            roadGradient.addColorStop(0, '#5A5A5A');
            roadGradient.addColorStop(0.5, '#696969');
            roadGradient.addColorStop(1, '#5A5A5A');
            ctx.fillStyle = roadGradient;
            ctx.fillRect(0, 480, canvas.width, 120);

            // Road texture
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            for (let i = 0; i < canvas.width; i += 20) {
                for (let j = 480; j < 600; j += 20) {
                    if (Math.random() > 0.7) {
                        ctx.fillRect(i, j, Math.random() * 3, Math.random() * 3);
                    }
                }
            }

            // Road center line
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(0, 520, canvas.width, 4);

            // Road edge lines
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 485, canvas.width, 3);
            ctx.fillRect(0, 597, canvas.width, 3);

            // Street stripes (dashed center line)
            for (let i = 0; i < canvas.width; i += 60) {
                ctx.fillRect(i, 540, 40, 8);
            }
        }

        function drawCloud(x, y, scale) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(x, y, 20 * scale, 0, Math.PI * 2);
            ctx.arc(x + 25 * scale, y - 5 * scale, 25 * scale, 0, Math.PI * 2);
            ctx.arc(x + 50 * scale, y, 20 * scale, 0, Math.PI * 2);
            ctx.arc(x + 35 * scale, y + 10 * scale, 20 * scale, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBird(x, y) {
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x - 8, y);
            ctx.quadraticCurveTo(x - 4, y - 5, x, y);
            ctx.quadraticCurveTo(x + 4, y - 5, x + 8, y);
            ctx.stroke();
        }

        function drawDetailedTree(x, y) {
            // Tree shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.ellipse(x + 10, y + 120, 25, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Tree trunk
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x, y, 20, 120);

            // Trunk texture
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 2;
            for (let i = 0; i < 120; i += 20) {
                ctx.beginPath();
                ctx.moveTo(x + 3, y + i);
                ctx.lineTo(x + 3, y + i + 10);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + 15, y + i + 5);
                ctx.lineTo(x + 15, y + i + 15);
                ctx.stroke();
            }

            // Tree branches
            ctx.strokeStyle = '#6B4423';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 20);
            ctx.lineTo(x - 15, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 20);
            ctx.lineTo(x + 35, y + 5);
            ctx.stroke();

            // Tree foliage (multiple layers for depth)
            ctx.fillStyle = '#1a5f1a';
            ctx.beginPath();
            ctx.arc(x + 10, y, 45, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#228B22';
            ctx.beginPath();
            ctx.arc(x + 10, y - 5, 42, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#32CD32';
            ctx.beginPath();
            ctx.arc(x - 5, y + 5, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 25, y + 5, 30, 0, Math.PI * 2);
            ctx.fill();

            // Highlight on foliage
            ctx.fillStyle = 'rgba(144, 238, 144, 0.4)';
            ctx.beginPath();
            ctx.arc(x + 5, y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawFlowers(x, y) {
            const flowerColors = ['#FF69B4', '#FF1493', '#FFB6C1', '#FF0080'];
            for (let i = 0; i < 5; i++) {
                const flowerX = x + i * 12;

                // Stem
                ctx.strokeStyle = '#228B22';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(flowerX, y);
                ctx.lineTo(flowerX, y + 20);
                ctx.stroke();

                // Flower petals
                ctx.fillStyle = flowerColors[Math.floor(Math.random() * flowerColors.length)];
                for (let j = 0; j < 5; j++) {
                    const angle = (Math.PI * 2 / 5) * j;
                    ctx.beginPath();
                    ctx.arc(flowerX + Math.cos(angle) * 4, y + Math.sin(angle) * 4, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Flower center
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(flowerX, y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawBush(x, y) {
            // Bush shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.ellipse(x + 20, y + 35, 25, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Bush layers
            ctx.fillStyle = '#2F4F2F';
            ctx.beginPath();
            ctx.arc(x, y + 20, 18, 0, Math.PI * 2);
            ctx.arc(x + 20, y + 15, 22, 0, Math.PI * 2);
            ctx.arc(x + 40, y + 20, 18, 0, Math.PI * 2);
            ctx.arc(x + 20, y + 30, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#3CB371';
            ctx.beginPath();
            ctx.arc(x + 5, y + 18, 15, 0, Math.PI * 2);
            ctx.arc(x + 20, y + 12, 18, 0, Math.PI * 2);
            ctx.arc(x + 35, y + 18, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawStreetLamp(x, y) {
            // Lamp post shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(x + 2, y + 2, 6, 92);

            // Lamp post
            ctx.fillStyle = '#4A4A4A';
            ctx.fillRect(x, y, 6, 90);

            // Lamp post shine
            ctx.fillStyle = '#6A6A6A';
            ctx.fillRect(x, y, 2, 90);

            // Lamp arm
            ctx.strokeStyle = '#4A4A4A';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x + 3, y + 10);
            ctx.lineTo(x + 25, y);
            ctx.stroke();

            // Lamp head
            ctx.fillStyle = '#3A3A3A';
            ctx.beginPath();
            ctx.moveTo(x + 20, y - 5);
            ctx.lineTo(x + 15, y + 10);
            ctx.lineTo(x + 35, y + 10);
            ctx.lineTo(x + 30, y - 5);
            ctx.closePath();
            ctx.fill();

            // Lamp light
            ctx.fillStyle = '#FFFACD';
            ctx.beginPath();
            ctx.arc(x + 25, y + 5, 6, 0, Math.PI * 2);
            ctx.fill();

            // Light glow
            const lampGlow = ctx.createRadialGradient(x + 25, y + 5, 0, x + 25, y + 5, 30);
            lampGlow.addColorStop(0, 'rgba(255, 250, 205, 0.3)');
            lampGlow.addColorStop(1, 'rgba(255, 250, 205, 0)');
            ctx.fillStyle = lampGlow;
            ctx.beginPath();
            ctx.arc(x + 25, y + 5, 30, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPerson() {
            // Person shadow on ground
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(person.x, person.y + 60, 30, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(person.x, person.y);

            // Smooth angle transition
            person.angle += (person.targetAngle - person.angle) * 0.1;
            ctx.rotate(person.angle);

            // Body (shirt with details)
            const shirtGradient = ctx.createLinearGradient(-person.width / 2, -person.height, person.width / 2, -person.height + 60);
            shirtGradient.addColorStop(0, '#FF7F7F');
            shirtGradient.addColorStop(1, '#FF6B6B');
            ctx.fillStyle = shirtGradient;
            ctx.fillRect(-person.width / 2, -person.height, person.width, person.height * 0.6);

            // Shirt collar
            ctx.fillStyle = '#FF5555';
            ctx.beginPath();
            ctx.moveTo(-8, -person.height);
            ctx.lineTo(-12, -person.height + 8);
            ctx.lineTo(-5, -person.height + 8);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(8, -person.height);
            ctx.lineTo(12, -person.height + 8);
            ctx.lineTo(5, -person.height + 8);
            ctx.closePath();
            ctx.fill();

            // Shirt buttons
            ctx.fillStyle = '#FFFFFF';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(0, -person.height + 15 + i * 12, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Neck
            ctx.fillStyle = '#FFCC99';
            ctx.fillRect(-6, -person.height - 5, 12, 10);

            // Head
            ctx.fillStyle = '#FFD1A4';
            ctx.beginPath();
            ctx.arc(0, -person.height - 15, 20, 0, Math.PI * 2);
            ctx.fill();

            // Ears
            ctx.fillStyle = '#FFD1A4';
            ctx.beginPath();
            ctx.arc(-18, -person.height - 15, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(18, -person.height - 15, 6, 0, Math.PI * 2);
            ctx.fill();

            // Hair
            ctx.fillStyle = '#4A2511';
            ctx.beginPath();
            ctx.arc(-10, -person.height - 20, 12, 0, Math.PI * 2);
            ctx.arc(0, -person.height - 28, 14, 0, Math.PI * 2);
            ctx.arc(10, -person.height - 20, 12, 0, Math.PI * 2);
            ctx.fill();

            // Hair highlight
            ctx.fillStyle = 'rgba(139, 90, 43, 0.4)';
            ctx.beginPath();
            ctx.arc(-5, -person.height - 30, 8, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-6, -person.height - 15, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(6, -person.height - 15, 2, 0, Math.PI * 2);
            ctx.fill();

            // Eye shine
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(-5, -person.height - 16, 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(7, -person.height - 16, 1, 0, Math.PI * 2);
            ctx.fill();

            // Nose
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, -person.height - 15);
            ctx.lineTo(2, -person.height - 10);
            ctx.stroke();

            // Smile
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, -person.height - 10, 6, 0.2, Math.PI - 0.2);
            ctx.stroke();

            // Arms with hands
            ctx.strokeStyle = '#FF6B6B';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';

            // Left arm
            ctx.beginPath();
            ctx.moveTo(-person.width / 2, -person.height + 20);
            ctx.lineTo(-person.width / 2 - 20, -person.height + 50);
            ctx.stroke();

            // Left hand
            ctx.fillStyle = '#FFD1A4';
            ctx.beginPath();
            ctx.arc(-person.width / 2 - 20, -person.height + 50, 5, 0, Math.PI * 2);
            ctx.fill();

            // Right arm
            ctx.strokeStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.moveTo(person.width / 2, -person.height + 20);
            ctx.lineTo(person.width / 2 + 20, -person.height + 50);
            ctx.stroke();

            // Right hand
            ctx.fillStyle = '#FFD1A4';
            ctx.beginPath();
            ctx.arc(person.width / 2 + 20, -person.height + 50, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Legs (pants)
            ctx.strokeStyle = '#4169E1';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';

            // Left leg
            ctx.beginPath();
            ctx.moveTo(person.x - 10, person.y - 40);
            ctx.lineTo(person.leftFootX, person.leftFootY - 10);
            ctx.stroke();

            // Right leg
            ctx.beginPath();
            ctx.moveTo(person.x + 10, person.y - 40);
            ctx.lineTo(person.rightFootX, person.rightFootY - 10);
            ctx.stroke();

            // Feet with shoes or barefoot
            drawFeet();
        }

        function drawFeet() {
            if (selectedShoe === 'sneakers') {
                // Left sneaker shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.ellipse(person.leftFootX + 2, person.leftFootY + 3, 18, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Left sneaker base
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(person.leftFootX, person.leftFootY, 18, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Left sneaker sole
                ctx.fillStyle = '#E8E8E8';
                ctx.beginPath();
                ctx.ellipse(person.leftFootX, person.leftFootY + 8, 18, 5, 0, 0, Math.PI);
                ctx.fill();
                ctx.stroke();

                // Left sneaker accent
                ctx.fillStyle = '#667eea';
                ctx.beginPath();
                ctx.ellipse(person.leftFootX - 5, person.leftFootY - 5, 10, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Left sneaker laces
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 1;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(person.leftFootX - 8 + i * 5, person.leftFootY - 3);
                    ctx.lineTo(person.leftFootX - 6 + i * 5, person.leftFootY);
                    ctx.stroke();
                }

                // Left sneaker logo
                ctx.fillStyle = '#764ba2';
                ctx.beginPath();
                ctx.arc(person.leftFootX + 8, person.leftFootY - 2, 3, 0, Math.PI * 2);
                ctx.fill();

                // Right sneaker shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.ellipse(person.rightFootX + 2, person.rightFootY + 3, 18, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Right sneaker base
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(person.rightFootX, person.rightFootY, 18, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Right sneaker sole
                ctx.fillStyle = '#E8E8E8';
                ctx.beginPath();
                ctx.ellipse(person.rightFootX, person.rightFootY + 8, 18, 5, 0, 0, Math.PI);
                ctx.fill();
                ctx.stroke();

                // Right sneaker accent
                ctx.fillStyle = '#667eea';
                ctx.beginPath();
                ctx.ellipse(person.rightFootX - 5, person.rightFootY - 5, 10, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Right sneaker laces
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 1;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(person.rightFootX - 8 + i * 5, person.rightFootY - 3);
                    ctx.lineTo(person.rightFootX - 6 + i * 5, person.rightFootY);
                    ctx.stroke();
                }

                // Right sneaker logo
                ctx.fillStyle = '#764ba2';
                ctx.beginPath();
                ctx.arc(person.rightFootX + 8, person.rightFootY - 2, 3, 0, Math.PI * 2);
                ctx.fill();

            } else if (selectedShoe === 'heels') {
                // Left heel shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(person.leftFootX, person.leftFootY + 5, 15, 5, -0.3, 0, Math.PI * 2);
                ctx.fill();

                // Left heel shoe
                ctx.fillStyle = '#f5576c';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(person.leftFootX - 5, person.leftFootY - 8, 15, 8, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Left heel shine
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.ellipse(person.leftFootX - 8, person.leftFootY - 10, 6, 4, -0.3, 0, Math.PI);
                ctx.fill();

                // Left heel strap
                ctx.strokeStyle = '#f5576c';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(person.leftFootX - 5, person.leftFootY - 15, 8, 0, Math.PI);
                ctx.stroke();

                // Left heel buckle
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 1;
                ctx.strokeRect(person.leftFootX - 10, person.leftFootY - 18, 3, 3);

                // Left heel stiletto
                ctx.strokeStyle = '#8B0000';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(person.leftFootX + 8, person.leftFootY - 5);
                ctx.lineTo(person.leftFootX + 10, person.leftFootY + 8);
                ctx.stroke();

                // Right heel shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(person.rightFootX, person.rightFootY + 5, 15, 5, -0.3, 0, Math.PI * 2);
                ctx.fill();

                // Right heel shoe
                ctx.fillStyle = '#f5576c';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(person.rightFootX - 5, person.rightFootY - 8, 15, 8, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Right heel shine
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.ellipse(person.rightFootX - 8, person.rightFootY - 10, 6, 4, -0.3, 0, Math.PI);
                ctx.fill();

                // Right heel strap
                ctx.strokeStyle = '#f5576c';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(person.rightFootX - 5, person.rightFootY - 15, 8, 0, Math.PI);
                ctx.stroke();

                // Right heel buckle
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 1;
                ctx.strokeRect(person.rightFootX - 10, person.rightFootY - 18, 3, 3);

                // Right heel stiletto
                ctx.strokeStyle = '#8B0000';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(person.rightFootX + 8, person.rightFootY - 5);
                ctx.lineTo(person.rightFootX + 10, person.rightFootY + 8);
                ctx.stroke();

            } else {
                // Barefoot - Left foot shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.ellipse(person.leftFootX + 2, person.leftFootY + 3, 15, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Left foot
                ctx.fillStyle = '#FFD1A4';
                ctx.strokeStyle = '#D4A574';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(person.leftFootX, person.leftFootY, 15, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Left foot toes
                ctx.fillStyle = '#FFCC99';
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.arc(person.leftFootX - 12 + i * 5, person.leftFootY - 6, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Right foot shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.ellipse(person.rightFootX + 2, person.rightFootY + 3, 15, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Right foot
                ctx.fillStyle = '#FFD1A4';
                ctx.strokeStyle = '#D4A574';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(person.rightFootX, person.rightFootY, 15, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Right foot toes
                ctx.fillStyle = '#FFCC99';
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.arc(person.rightFootX - 12 + i * 5, person.rightFootY - 6, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Highlight dragged foot with animation
            if (draggedFoot) {
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#FFD700';
                ctx.beginPath();
                if (draggedFoot === 'left') {
                    ctx.arc(person.leftFootX, person.leftFootY, 25, 0, Math.PI * 2);
                } else {
                    ctx.arc(person.rightFootX, person.rightFootY, 25, 0, Math.PI * 2);
                }
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.shadowBlur = 0;
            }
        }

        function drawBalanceBar() {
            const barWidth = 200;
            const barHeight = 20;
            const barX = canvas.width - barWidth - 20;
            const barY = 20;

            // Background
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(barX, barY, barWidth, barHeight);

            // Balance level
            const balancePercent = Math.min(person.balance / currentSettings.balanceThreshold, 1);
            const fillWidth = barWidth * balancePercent;

            if (balancePercent < 0.5) {
                ctx.fillStyle = '#4CAF50';
            } else if (balancePercent < 0.8) {
                ctx.fillStyle = '#FFC107';
            } else {
                ctx.fillStyle = '#F44336';
            }
            ctx.fillRect(barX, barY, fillWidth, barHeight);

            // Border
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barWidth, barHeight);

            // Label
            ctx.fillStyle = '#000000';
            ctx.font = '14px Arial';
            ctx.fillText('Balance', barX, barY - 5);
        }

        function drawGoal() {
            // Goal flag
            const goalX = canvas.width - 80;
            const goalY = 380;

            // Flag pole shadow
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(goalX + 2, goalY + 2);
            ctx.lineTo(goalX + 2, goalY + 92);
            ctx.stroke();

            // Flag pole
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(goalX, goalY);
            ctx.lineTo(goalX, goalY + 90);
            ctx.stroke();

            // Flag pole highlight
            ctx.strokeStyle = '#A0522D';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(goalX - 1, goalY);
            ctx.lineTo(goalX - 1, goalY + 90);
            ctx.stroke();

            // Flag pole base
            ctx.fillStyle = '#654321';
            ctx.fillRect(goalX - 8, goalY + 90, 16, 10);
            ctx.strokeStyle = '#4A3319';
            ctx.lineWidth = 1;
            ctx.strokeRect(goalX - 8, goalY + 90, 16, 10);

            // Flag shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.beginPath();
            ctx.moveTo(goalX + 2, goalY + 2);
            ctx.lineTo(goalX + 52, goalY + 17);
            ctx.lineTo(goalX + 2, goalY + 32);
            ctx.fill();

            // Flag background
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.moveTo(goalX, goalY);
            ctx.lineTo(goalX + 50, goalY + 15);
            ctx.lineTo(goalX, goalY + 30);
            ctx.fill();

            // Flag border
            ctx.strokeStyle = '#2E7D32';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Checkered pattern
            ctx.fillStyle = '#FFFFFF';
            for (let i = 0; i < 2; i++) {
                for (let j = 0; j < 3; j++) {
                    if ((i + j) % 2 === 0) {
                        ctx.fillRect(goalX + j * 16.6, goalY + i * 15, 16.6, 15);
                    }
                }
            }

            // Checkered pattern borders
            ctx.strokeStyle = '#E0E0E0';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 2; i++) {
                for (let j = 0; j < 3; j++) {
                    if ((i + j) % 2 === 0) {
                        ctx.strokeRect(goalX + j * 16.6, goalY + i * 15, 16.6, 15);
                    }
                }
            }

            // Flag wave effect (static)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(goalX + 10, goalY + 5);
            ctx.quadraticCurveTo(goalX + 20, goalY + 3, goalX + 30, goalY + 5);
            ctx.stroke();

            // Goal text
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 16px Arial';
            ctx.shadowBlur = 5;
            ctx.shadowColor = '#000000';
            ctx.fillText('GOAL', goalX - 20, goalY - 10);
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            if (gameState !== STATES.PLAYING) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw everything
            drawStreet();
            drawGoal();
            drawPerson();
            drawBalanceBar();

            requestAnimationFrame(gameLoop);
        }

        // Initial draw (just the street before game starts)
        function initialDraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawStreet();
            drawGoal();

            // Draw barefoot person in initial position
            person.angle = 0;
            person.targetAngle = 0;
            drawPerson();
        }

        initialDraw();
    </script>
</body>
</html>
